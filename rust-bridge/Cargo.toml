[package]
name = "passport-bridge"
version = "0.4.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
tungstenite = "0.26"
serialport = { version = "4.7", default-features = false }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"
aes-gcm = "0.11"
hmac = "0.12"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
